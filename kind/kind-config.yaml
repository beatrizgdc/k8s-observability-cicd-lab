# Cluster Kind do lab. O lab.sh substitui __LOGDIR__ e __WORKER__ antes de criar o cluster.
# 1 control-plane (recebe as portas) + 1 worker (roda as cargas de trabalho).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraMounts:
      - hostPath: __LOGDIR__/control-plane
        containerPath: /var/log/pods      # logs dos pods ficam visíveis ao Alloy/Loki
    extraPortMappings:
      - { containerPort: 80,    hostPort: 8080,  listenAddress: "127.0.0.1" }  # Ingress HTTP
      - { containerPort: 443,   hostPort: 8443,  listenAddress: "127.0.0.1" }  # Ingress HTTPS
      - { containerPort: 30080, hostPort: 30080, listenAddress: "127.0.0.1" }  # Service NodePort do app
      - { containerPort: 30090, hostPort: 9090,  listenAddress: "127.0.0.1" }  # Prometheus
#__WORKER__
