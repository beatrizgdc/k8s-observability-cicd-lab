# Prometheus dentro do cluster (como em produção): descobre pods por annotation e coleta cAdvisor do kubelet.
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-lab }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-lab }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-lab }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/rules/*.yml]
    scrape_configs:
      - job_name: lab-app                       # pods com annotation prometheus.io/scrape=true
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: cadvisor                       # CPU/memória/throttling por container (via kubelet)
        scheme: https
        tls_config: { insecure_skip_verify: true }
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        kubernetes_sd_configs: [{ role: node }]
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
  rules.yml: |
    groups:
      - name: lab-golden-signals
        rules:
          - alert: AppDown
            expr: count(up{job="lab-app"} == 1) == 0 or absent(up{job="lab-app"})
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "Nenhum pod do lab-app está respondendo /metrics (Availability)" }
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[2m]))
                / clamp_min(sum(rate(http_requests_total[2m])), 0.001) > 0.05
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "Mais de 5% das requisições retornam 5xx (Errors)" }
          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{path="/api/work"}[2m]))) > 0.5
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "p95 de /api/work acima de 500ms (Latency)" }
          - alert: ContainerCpuThrottled
            expr: |
              sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=~"demo|inc-.*",container="app"}[2m]))
                / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=~"demo|inc-.*",container="app"}[2m])), 0.001) > 0.25
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "Container com >25% dos períodos de CPU limitados (Saturation)" }
          - alert: ContainerMemoryNearLimit
            expr: |
              container_memory_working_set_bytes{namespace=~"demo|inc-.*",container="app"}
                / (container_spec_memory_limit_bytes{namespace=~"demo|inc-.*",container="app"} > 0) > 0.85
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "Memória do container acima de 85% do limit; risco de OOMKilled (Saturation)" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.path=/prometheus
          ports: [{ containerPort: 9090 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: config, mountPath: /etc/prometheus/rules/rules.yml, subPath: rules.yml }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30090 }]
